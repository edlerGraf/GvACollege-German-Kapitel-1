<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kapitel 1 · Übung E · Richtig!</title>
<style>
  :root {
    --desk:#ECEAE4; --paper:#FFF; --ink:#1A1A1A; --muted:#6B6760; --rule:#D7D3CA;
    --pen:#C0281E; --pen-soft:#F8E8E6; --good:#1E7A46; --good-soft:#E6F2EA;
    --serif:"Times New Roman",Times,"Nimbus Roman",Georgia,serif;
  }
  * { box-sizing:border-box; }
  html { background:var(--desk); }
  body { margin:0; font-family:var(--serif); font-size:17px; line-height:1.5; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .page { max-width:660px; margin:28px auto 60px; background:var(--paper); padding:40px 56px 48px; box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 30px rgba(0,0,0,.06); }
  @media (max-width:720px){ .page{ margin:0; padding:24px 20px 40px; box-shadow:none; } body{ font-size:16px; } }

  .running-head { display:flex; justify-content:space-between; gap:12px; font-style:italic; font-size:15px; border-bottom:1px solid var(--rule); padding-bottom:8px; margin-bottom:30px; }
  .running-head b { font-style:normal; font-weight:700; }
  h1 { font-size:28px; font-weight:700; margin:0 0 4px; }
  h1 .num { font-weight:400; margin-right:.5em; }

  .item { border-top:1px solid var(--ink); border-bottom:1px solid var(--rule); padding:24px 0 22px; margin:28px 0 18px; }
  .given { font-size:24px; margin:0 0 6px; line-height:1.4; }
  .given .repl { color:var(--pen); }
  .trans { color:var(--muted); font-style:italic; font-size:17px; margin:0 0 14px; line-height:1.35; }
  .trans .blank-en { color:var(--rule); font-style:normal; }
  .trans .fill { color:var(--good); font-style:normal; }
  .answer-sentence { font-size:24px; margin:0 0 6px; line-height:1.4; }
  input[type="text"] { font:inherit; font-size:24px; padding:2px 6px; width:3.4em; text-align:center;
    border:0; border-bottom:1.5px solid var(--ink); border-radius:0; background:var(--paper); color:var(--ink); }
  input[type="text"]::placeholder { color:var(--rule); }
  input[type="text"]:focus { outline:none; border-bottom-color:var(--pen); }

  .button-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; cursor:pointer; }
  .act { font-size:15px; font-variant:small-caps; letter-spacing:.06em; padding:9px 18px; background:var(--ink); color:var(--paper); border:1px solid var(--ink); border-radius:0; }
  .act.quiet { background:none; color:var(--ink); }
  .act[disabled] { opacity:.4; cursor:default; }
  :focus-visible { outline:2px solid var(--pen); outline-offset:2px; }

  .mark { min-height:2.2em; margin-top:16px; font-size:18px; padding:8px 12px; border-left:3px solid transparent; }
  .mark.good { background:var(--good-soft); border-left-color:var(--good); }
  .mark.bad  { background:var(--pen-soft);  border-left-color:var(--pen); }
  .stamp { display:inline-block; margin-right:10px; font-style:italic; font-weight:700; font-size:24px; }
  .stamp.right { color:var(--good); }
  .stamp.right::before { content:"\2713\00a0"; font-style:normal; }
  .stamp.wrong { color:var(--pen); }
  .stamp.wrong::before { content:"\2717\00a0"; font-style:normal; }
  .correction { color:var(--pen); }
  .correction s { text-decoration:line-through; text-decoration-color:var(--pen); }
  .correction .caret { font-size:13px; vertical-align:sub; margin:0 2px; }
  .note { color:var(--muted); font-size:16px; margin-top:6px; }
  .note i { color:var(--ink); }

  .score-line { display:flex; justify-content:space-between; align-items:baseline; color:var(--muted); font-size:15px; }
  .score-line b { color:var(--ink); font-size:17px; }
  .summary { border:1px solid var(--ink); padding:18px 20px; margin-top:18px; }
  .summary p:last-child { margin-bottom:0; }
  .signoff { text-align:right; margin-top:26px; line-height:1.35; }

  details { margin-top:32px; border-top:1px solid var(--rule); padding-top:14px; }
  summary { cursor:pointer; color:var(--muted); }
  .wortschatz { columns:2; column-gap:32px; font-size:16px; margin-top:12px; }
  .wortschatz div { break-inside:avoid; margin-bottom:2px; }
  .wortschatz span { color:var(--muted); }
  @media (max-width:520px){ .wortschatz{ columns:1; } }
  .hidden { display:none !important; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<main class="page">
  <div class="running-head"><span>Basic structures of reality</span><span><b>Übung E</b> · Kapitel 1</span></div>
  <h1><span class="num">E</span>Richtig!</h1>

  <div class="item" id="item">
    <p class="given" id="given"></p>
    <p class="trans" id="given-en"></p>
    <p class="answer-sentence">
      <span class="ja">Ja,&nbsp;</span><label class="sr-only" for="answer">Pronoun that replaces the highlighted noun</label>
      <input type="text" id="answer" name="pron-4931" inputmode="text"
             autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" lang="de"
             placeholder="?"><span id="rest"></span>
    </p>
    <p class="trans" id="answer-en"></p>
    <div class="button-row">
      <button class="act" id="check" type="button">Prüfen</button>
      <button class="act quiet hidden" id="next" type="button">Weiter →</button>
    </div>
    <div class="mark" id="mark" aria-live="polite"></div>
  </div>

  <div class="score-line"><span>Sentence <b id="pos">1</b> of <b id="total">14</b></span><span>Points <b id="score">0</b></span></div>
  <div class="summary hidden" id="summary"></div>

  <details>
    <summary>Wortschatz for Exercise B — open only after you have looked the words up yourself</summary>
    <div class="wortschatz" id="wortschatz"></div>
  </details>

  <p class="signoff">Vorwärts! — <i>Graf von Anderson</i></p>
</main>

<script>
(function () {
  'use strict';

  // gender m/f/n; tricky = not what an English speaker would guess (worth 2).
  // nopl = no ordinary count plural (skip in plural prompts).
  // g = gender; tricky = worth 2; nopl = no count plural.
  // k = semantic kind, used to pick a sensible adjective:
  //   person, animal, creature (mythical), structure, place (landscape/space),
  //   thing (inanimate object), drink, food, force (weather/mass).
  // esg/epl = English singular/plural noun; person = true for humans (English he/she).
  var NOUNS = [
    { en:'emperor',   sg:'der Kaiser',       pl:'die Kaiser',        g:'m', k:'person', person:true,  esg:'the emperor',   epl:'the emperors' },
    { en:'empress',   sg:'die Kaiserin',     pl:'die Kaiserinnen',   g:'f', k:'person', person:true,  esg:'the empress',   epl:'the empresses' },
    { en:'king',      sg:'der König',        pl:'die Könige',        g:'m', k:'person', person:true,  esg:'the king',      epl:'the kings' },
    { en:'queen',     sg:'die Königin',      pl:'die Königinnen',    g:'f', k:'person', person:true,  esg:'the queen',     epl:'the queens' },
    { en:'prince',    sg:'der Prinz',        pl:'die Prinzen',       g:'m', k:'person', person:true,  esg:'the prince',    epl:'the princes' },
    { en:'princess',  sg:'die Prinzessin',   pl:'die Prinzessinnen', g:'f', k:'person', person:true,  esg:'the princess',  epl:'the princesses' },
    { en:'countess',  sg:'die Gräfin',       pl:'die Gräfinnen',     g:'f', k:'person', person:true,  esg:'the countess',  epl:'the countesses' },
    { en:'baron',     sg:'der Baron',        pl:'die Barone',        g:'m', k:'person', person:true,  esg:'the baron',     epl:'the barons' },
    { en:'knight',    sg:'der Ritter',       pl:'die Ritter',        g:'m', k:'person', person:true,  esg:'the knight',    epl:'the knights' },
    { en:'wizard',    sg:'der Zauberer',     pl:'die Zauberer',      g:'m', k:'person', person:true,  esg:'the wizard',    epl:'the wizards' },
    { en:'witch',     sg:'die Hexe',         pl:'die Hexen',         g:'f', k:'person', person:true,  esg:'the witch',     epl:'the witches' },
    { en:'dragon',    sg:'der Drache',       pl:'die Drachen',       g:'m', tricky:true, k:'creature', esg:'the dragon',   epl:'the dragons' },
    { en:'unicorn',   sg:'das Einhorn',      pl:'die Einhörner',     g:'n', tricky:true, k:'creature', esg:'the unicorn',  epl:'the unicorns' },
    { en:'frog',      sg:'der Frosch',       pl:'die Frösche',       g:'m', tricky:true, k:'animal',   esg:'the frog',     epl:'the frogs' },
    { en:'butterfly', sg:'der Schmetterling',pl:'die Schmetterlinge',g:'m', tricky:true, k:'animal',   esg:'the butterfly',epl:'the butterflies' },
    { en:'mushroom',  sg:'der Pilz',         pl:'die Pilze',         g:'m', tricky:true, k:'thing',     esg:'the mushroom', epl:'the mushrooms' },
    { en:'castle',    sg:'das Schloss',      pl:'die Schlösser',     g:'n', tricky:true, k:'structure', esg:'the castle',   epl:'the castles' },
    { en:'tower',     sg:'der Turm',         pl:'die Türme',         g:'m', tricky:true, k:'structure', esg:'the tower',    epl:'the towers' },
    { en:'house',     sg:'das Haus',         pl:'die Häuser',        g:'n', tricky:true, k:'structure', esg:'the house',    epl:'the houses' },
    { en:'forest',    sg:'der Wald',         pl:'die Wälder',        g:'m', tricky:true, k:'place',     esg:'the forest',   epl:'the forests' },
    { en:'mountain',  sg:'der Berg',         pl:'die Berge',         g:'m', tricky:true, k:'place',     esg:'the mountain', epl:'the mountains' },
    { en:'valley',    sg:'das Tal',          pl:'die Täler',         g:'n', tricky:true, k:'place',     esg:'the valley',   epl:'the valleys' },
    { en:'field',     sg:'das Feld',         pl:'die Felder',        g:'n', tricky:true, k:'place',     esg:'the field',    epl:'the fields' },
    { en:'room',      sg:'das Zimmer',       pl:'die Zimmer',        g:'n', tricky:true, k:'place',     esg:'the room',     epl:'the rooms' },
    { en:'bed',       sg:'das Bett',         pl:'die Betten',        g:'n', tricky:true, k:'thing',     esg:'the bed',      epl:'the beds' },
    { en:'wine',      sg:'der Wein',         pl:'die Weine',         g:'m', tricky:true, k:'drink',     esg:'the wine',     epl:'the wines' },
    { en:'beer',      sg:'das Bier',         pl:'die Biere',         g:'n', tricky:true, k:'drink',     esg:'the beer',     epl:'the beers' },
    { en:'pizza',     sg:'die Pizza',        pl:'die Pizzas',        g:'f', tricky:true, k:'food',      esg:'the pizza',    epl:'the pizzas' },
    { en:'cloud',     sg:'die Wolke',        pl:'die Wolken',        g:'f', tricky:true, k:'force',     esg:'the cloud',    epl:'the clouds' },
    { en:'thunder',   sg:'der Donner',       pl:'die Donner',        g:'m', tricky:true, nopl:true, k:'sound', esg:'the thunder', epl:'the thunder' }
  ];

  // Each adjective from Exercise C, with the kinds of noun it can sensibly describe.
  var ADJ = [
    { w:'groß',        k:['person','animal','creature','structure','place','thing'] },
    { w:'klein',       k:['person','animal','creature','structure','place','thing','food'] },
    { w:'stark',       k:['person','animal','creature','force','sound','drink'] },
    { w:'intelligent', k:['person','creature'] },
    { w:'nett',        k:['person','creature','animal'] },
    { w:'schön',       k:['person','animal','creature','structure','place','thing','food','sound','drink'] },
    { w:'unsterblich', k:['person','creature'] },
    { w:'grau',        k:['animal','structure','place','thing','force'] },
    { w:'schwarz',     k:['animal','creature','structure','thing','force'] },
    { w:'braun',       k:['animal','structure','thing','food'] },
    { w:'weiß',        k:['animal','creature','structure','thing','force'] },
    { w:'durchsichtig',k:['force'] },
    { w:'schmutzig',   k:['animal','structure','place','thing'] }
  ];

  function adjFor(n){
    var ok = [];
    for (var i=0;i<ADJ.length;i++){ if (ADJ[i].k.indexOf(n.k) !== -1) ok.push(ADJ[i].w); }
    return pick(ok);
  }

  // English glosses for the Exercise C adjectives.
  var ADJ_EN = {
    'groß':'big', 'klein':'small', 'stark':'strong', 'intelligent':'intelligent',
    'nett':'nice', 'schön':'beautiful', 'unsterblich':'immortal', 'grau':'grey',
    'schwarz':'black', 'braun':'brown', 'weiß':'white', 'durchsichtig':'transparent',
    'schmutzig':'dirty'
  };
  function adjEn(w){ return ADJ_EN[w] || w; }

  // English subject pronoun for the CORRECT answer, honouring "it/they for non-people".
  //   person + singular -> he/she (by gender);  non-person singular -> it;  any plural -> they.
  function enPronCorrect(n, plural){
    if (plural) return 'they';
    if (n.person) return (n.g === 'f') ? 'she' : 'he';
    return 'it';
  }

  // English gloss of a pronoun the student TYPED, read against the sentence's verb.
  //   Singular sentence (ist): er->he, sie->she, es->it.
  //   Plural sentence (sind):  sie->they;  er/es are singular, flagged separately.
  function enPronTyped(word, plural){
    var w = word.toLowerCase();
    if (plural){
      if (w === 'sie') return 'they';
      if (w === 'er')  return 'he';   // number mismatch, noted elsewhere
      if (w === 'es')  return 'it';
    } else {
      if (w === 'er')  return 'he';
      if (w === 'sie') return 'she';
      if (w === 'es')  return 'it';
    }
    return null; // not one of the third-person pronouns
  }
  function enBe(plural){ return plural ? 'are' : 'is'; }

  var GENDER = { m:'masculine', f:'feminine', n:'neuter' };
  var PRON   = { m:'er', f:'sie', n:'es' };
  var TOTAL  = 14;

  function pron(n, plural){ return plural ? 'sie' : PRON[n.g]; }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function el(id){ return document.getElementById(id); }

  // Normalise a typed answer: trim, lower-case, strip surrounding punctuation/period.
  function norm(s){ return s.replace(/[.\s]+$/,'').replace(/^\s+/,'').trim().toLowerCase(); }

  // Build the round: a shuffled mix of singular and plural prompts, no repeats until the pool is used.
  function buildRound(){
    var items = [];
    var pool = shuffle(NOUNS);
    for (var i=0; i<pool.length && items.length<TOTAL; i++){
      var n = pool[i];
      var plural = (!n.nopl) && (Math.random() < 0.4);
      items.push({ en:n.en, plural:plural, adj:adjFor(n) });
    }
    // top up if the pool was short
    while (items.length < TOTAL){
      var n2 = pick(NOUNS);
      items.push({ en:n2.en, plural:(!n2.nopl)&&(Math.random()<0.4), adj:adjFor(n2) });
    }
    return shuffle(items);
  }

  var state;

  function start(){
    state = { items: buildRound(), i:0, score:0, answered:false, sieShe:0, sieThey:0 };
    el('total').textContent = TOTAL;
    el('summary').classList.add('hidden');
    el('item').classList.remove('hidden');
    show();
  }

  function nounOf(en){ for (var k=0;k<NOUNS.length;k++) if (NOUNS[k].en===en) return NOUNS[k]; }

  function show(){
    var it = state.items[state.i];
    var n = nounOf(it.en);
    var subj = it.plural ? n.pl : n.sg;
    var verb = it.plural ? 'sind' : 'ist';
    var esub = it.plural ? n.epl : n.esg;           // "the emperor" / "the emperors"
    var ebe  = enBe(it.plural);                      // is / are
    var eadj = adjEn(it.adj);                         // nice / grey ...
    var tag  = it.plural ? "aren't they?" : (n.person ? (n.g==='f' ? "isn't she?" : "isn't he?") : "isn't it?");

    el('given').innerHTML = '<span class="repl">'+cap(subj)+'</span> '+verb+' '+it.adj+', nicht wahr?';
    el('given-en').innerHTML = cap(esub)+' '+ebe+' '+eadj+', '+tag;

    el('rest').textContent = ' '+verb+' '+it.adj+'.';
    // English answer line: pronoun blank until the student responds.
    el('answer-en').innerHTML = 'Yes, <span class="blank-en">___</span> '+ebe+' '+eadj+'.';

    var inp = el('answer');
    inp.value = '';
    inp.disabled = false;
    el('mark').className = 'mark';
    el('mark').innerHTML = '';
    el('check').classList.remove('hidden');
    el('next').classList.add('hidden');
    el('pos').textContent = state.i + 1;
    el('score').textContent = state.score;
    state.answered = false;
    inp.focus();
  }

  function check(){
    if (state.answered) return;
    var typed = el('answer').value;
    var cleaned = norm(typed);
    if (!cleaned) { el('answer').focus(); return; }

    var it = state.items[state.i];
    var n = nounOf(it.en);
    var want = pron(n, it.plural);
    // Answer follows "Ja," mid-sentence, so it must be lowercase. Compare case-sensitively
    // (after trimming spaces and a trailing period only — not lowercasing).
    var trimmed = typed.replace(/[.\s]+$/,'').replace(/^\s+/,'').trim();
    var correct = (trimmed === want);
    var capitalizedButRight = (!correct) && (trimmed.toLowerCase() === want);
    var worth = (it.plural || n.tricky) ? 2 : 1;

    state.answered = true;
    el('answer').disabled = true;

    var mark = el('mark');
    var eadj = adjEn(it.adj);
    var ebe  = enBe(it.plural);
    var wantEn = enPronCorrect(n, it.plural);        // he/she/it/they for the correct answer
    var verb = it.plural ? 'sind' : 'ist';
    // the complete corrected sentence and its translation
    var fullDe = 'Ja, '+want+' '+verb+' '+it.adj+'.';
    var fullEn = 'Yes, '+wantEn+' '+ebe+' '+eadj+'.';

    if (correct){
      state.score += worth;
      if (it.plural) state.sieThey++; else if (n.g==='f') state.sieShe++;
      // complete the English sentence with the right pronoun
      el('answer-en').innerHTML = 'Yes, <span class="fill">'+wantEn+'</span> '+ebe+' '+eadj+'.';
      mark.className = 'mark good';
      mark.innerHTML = '<span class="stamp right">Richtig!</span> <span class="note">+'+worth+'</span>';
    } else {
      // English gloss of what they typed, read against the sentence's verb.
      var typedEn = enPronTyped(trimmed.toLowerCase(), it.plural);
      var contrast = '';
      if (typedEn && typedEn !== wantEn){
        contrast = 'Not <i>“'+typedEn+' '+enBe(typedEn==='they')+' '+eadj+'”</i> — rather, <b>'+wantEn.toUpperCase()+'</b> '+ebe+' '+eadj+'.';
        // number-mismatch note: a singular pronoun typed on a plural sentence
        if (it.plural && (trimmed.toLowerCase()==='er' || trimmed.toLowerCase()==='es')){
          contrast += ' (<i>'+trimmed.toLowerCase()+'</i> is singular, but the sentence is plural.)';
        }
      }
      // Leave the under-box English line with its blank; the completed
      // translation appears in the feedback panel below.
      mark.className = 'mark bad';
      // Feedback: the corrected sentence + translation, plus the contrast.
      // For an only-miscapitalized answer, add the one-line capitalization reminder.
      var tail = '<div class="note"><i>'+fullDe+'</i> — '+fullEn+'</div>';
      if (capitalizedButRight){
        tail += '<div class="note">After <i>Ja,</i> the pronoun stays lowercase; only <i>Sie</i> (formal “you”) and the first word of a sentence are capitalized.</div>';
      }
      mark.innerHTML = '<span class="stamp wrong">Nein.</span> <span class="correction"><s>'+
        escapeHtml(trimmed)+'</s><span class="caret">^</span>'+want+'</span>'+
        (contrast ? '<div class="note contrast">'+contrast+'</div>' : '')+
        tail;
    }
    el('score').textContent = state.score;
    el('check').classList.add('hidden');
    el('next').classList.remove('hidden');
    el('next').focus();
  }

  function escapeHtml(s){ return s.replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }

  function next(){
    state.i++;
    if (state.i < state.items.length){ show(); return; }
    var max = 0;
    for (var k=0;k<state.items.length;k++){ var n=nounOf(state.items[k].en); max += (state.items[k].plural || n.tricky) ? 2 : 1; }
    el('item').classList.add('hidden');
    var faith = (state.sieShe && state.sieThey)
      ? 'You answered <i>sie</i> for a feminine singular '+state.sieShe+' time'+(state.sieShe>1?'s':'')+' and for a plural '+state.sieThey+' time'+(state.sieThey>1?'s':'')+', and it worked every time — the thing p. 6 asked you to take on faith.'
      : 'Notice that <i>sie</i> answers both a feminine singular and any plural. Page 6 asked you to take that on faith; here you can watch it happen.';
    var s = el('summary');
    s.classList.remove('hidden');
    s.innerHTML =
      '<p><b>'+state.score+' of '+max+' points.</b></p>'+
      '<p>'+faith+'</p>'+
      '<p><button class="act" id="again" type="button">Noch einmal</button></p>';
    el('again').addEventListener('click', start);
    el('again').focus();
  }

  el('check').addEventListener('click', check);
  el('next').addEventListener('click', next);
  el('answer').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' || ev.keyCode === 13){
      ev.preventDefault();
      if (state.answered) next(); else check();
    }
  });

  // Wortschatz
  var w = '';
  for (var i=0;i<NOUNS.length;i++){ var n=NOUNS[i]; w += '<div>'+n.sg+(n.nopl?'':', '+n.pl)+' <span>'+n.en+'</span></div>'; }
  el('wortschatz').innerHTML = w;

  start();
})();
</script>
</body>
</html>
